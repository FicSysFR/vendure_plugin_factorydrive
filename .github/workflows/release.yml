name: Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: 'Version part to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'
      npm_publish:
        description: 'Publish to the npm registry?'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Bump version and update CHANGELOG.md
        run: node scripts/prepare-release.cjs --increment "${{ inputs.version_increment }}" --notes-out "${{ runner.temp }}/release-notes.md" --github-env

      # The CI job has its own filesystem, and npm publish skips prepublishOnly below.
      # Build and verify the package in this job before publishing any release artifacts.
      - name: Build and verify release package
        run: |
          yarn build
          yarn smoke
          yarn pack:check

      # main can move while this job runs (another release, a direct push): a plain push is
      # then rejected as non-fast-forward. Rebase the release commit onto origin/main and
      # retry instead of failing the whole run.
      - name: Push release commit and tag
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/main" && git push origin "${RELEASE_TAG}"; then
              exit 0
            fi
            if [ "$attempt" -ge 3 ]; then
              break
            fi
            echo "::warning::push rejected (attempt ${attempt}/3) — rebasing on origin/main and retrying"
            git fetch origin main
            git rebase origin/main
            git tag -d "${RELEASE_TAG}"
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          done
          echo "::error::could not push to main after 3 attempts" >&2
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${RELEASE_TAG}" --target main --title "${RELEASE_TAG}" --notes-file "${{ runner.temp }}/release-notes.md" --latest

      # Deferred until here: setup-node's registry-url writes an npmrc line referencing
      # ${NODE_AUTH_TOKEN}. Yarn Classic errors resolving *any* npmrc-backed command
      # (e.g. the `yarn install` above) if that env var isn't set — and it deliberately
      # isn't, since OIDC needs no static token. Only npm reads this lazily/safely.
      - name: Configure npm registry for OIDC publish
        if: ${{ inputs.npm_publish }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing: no npm token/secret involved. npm exchanges this job's
      # GitHub Actions OIDC identity (id-token: write, above) for a short-lived publish
      # token, provided a Trusted Publisher for this exact repo + workflow file is
      # configured on npmjs.com (package Settings → Publishing access). Requires npm
      # CLI >= 11.5.1, hence the upgrade — Node 22's bundled npm predates it.
      #
      # --ignore-scripts skips prepublishOnly (which shells out to yarn and would hit
      # the same ${NODE_AUTH_TOKEN} problem as above). CI already ran lint/typecheck/tests,
      # and this job rebuilt and checked dist before configuring the registry. The hook
      # stays in package.json as a safety net for a manual, non-CI `npm publish`.
      - name: Publish to npm (OIDC Trusted Publishing)
        if: ${{ inputs.npm_publish }}
        run: |
          npm install -g npm@latest
          npm publish --ignore-scripts --access public --provenance
